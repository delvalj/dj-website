# Lista de shows de KAS:ST.
# Normalmente se edita desde el panel /admin (fase 7). Si se edita a mano, cada show lleva:
#   date: AAAA-MM-DD          fecha del show (obligatoria)
#   venue: nombre de la sala  (obligatorio)
#   city: ciudad              (obligatoria)
#   country: código de país de 2 letras, p. ej. ES, US, DE (obligatorio)
#   ticketUrl: enlace de entradas (opcional; si falta se muestra "TBA")
#   soldOut: true si están agotadas (opcional)
#   placeholder: true si es un dato de ejemplo (opcional)
# El orden da igual: la web los ordena por fecha y oculta sola los que ya han pasado.
#
# DATOS DE EJEMPLO – BORRAR antes de publicar.
# Mientras quede algún show con "placeholder: true", la web muestra la etiqueta "SAMPLE DATA".

shows:
  # Fecha ya pasada: no debe aparecer en la web (sirve para comprobar que se ocultan solas).
  - date: 2026-10-10
    venue: PLACEHOLDER VENUE
    city: Madrid
    country: ES
    ticketUrl: https://example.com/tickets
    placeholder: true
